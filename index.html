<!doctype html>
<!--
=====================================================================
ПРОЕКТ «МОЙ ТРЕНЕР» (Telegram Mini App). Всё в одном файле.
=====================================================================
ЧТО ЭТО
  Приложение с планами тренировок. Открывается в браузере или внутри Telegram.
  Дневник и выбранный план хранятся в памяти телефона (localStorage).

КАК ЗАПУСТИТЬ
  Просто открой этот файл в браузере. Для Telegram нужен публичный адрес
  (например GitHub Pages), потом бот через @BotFather и кнопка «Открыть приложение».

ГДЕ ЧТО ЛЕЖИТ В КОДЕ (ищи по названию в комментариях)
  Рисунки          схемы упражнений (простые SVG, рисую сам)
  Упражнения       список EX. У каждого: название, группа, тип записи, советы
                   тип записи: s = вес и повторы, r = только повторы,
                   c = минуты (кардио), t = секунды (планка, растяжка)
  Готовые планы    список PLANS. У плана есть уровни: Лёгкий, Средний, Сложный
  Таймер           полоса снизу, свой таймер, быстрые кнопки
  Экраны           выбор плана, главный, день, упражнение, разминка, дневник, правка плана

КАК ДОБАВИТЬ УПРАЖНЕНИЕ
  В список EX добавь строку по образцу. Оно само появится в выборе упражнений.

ИСТОЧНИКИ
  Первый план: файл plan_full_body.html (по видео «Год мышц»).
  Упражнения и программа «По группам мышц»: статья axgym.ru
  (axgym.ru/articles/kak-nachat-trenirovatsya-muzhchine-novichku-sovety-bazovye-uprazhneniya-i-programma).
  Фото из статьи не использованы (авторские права), схемы нарисованы заново.

ЧТО СДЕЛАНО
  1. Прототип: выбор плана, дни, карточки упражнений, дневник.
  2. Чёрная тема и тёплые оранжевые кнопки.
  3. Кардио, растяжка, разминка, таймер отдыха, свой план.
  4. Свой таймер на главном экране и в упражнениях.
  5. Выбор сложности (Лёгкий, Средний, Сложный), Full Body на 2 и 3 дня,
     новые упражнения из статьи, программа «По группам мышц».
  6. Схемы для всех упражнений (включая кардио и растяжку), миниатюры в списках.

ИДЕИ НА БУДУЩЕЕ
  Выложить в интернет и подключить бота. Свои фото или гифки упражнений.
  Сохранение дневника в файл. Напоминания о тренировках через бота.

ВАЖНО
  Советы по технике составлены в общем виде, проверь их с тренером.
  Это не медицинская рекомендация.
=====================================================================
-->

var T={end:0,label:'',done:false},ctx=null;
function fmtT(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x}
function startTimer(sec,label){
 try{var AC=window.AudioContext||window.webkitAudioContext;if(!ctx&&AC)ctx=new AC();if(ctx&&ctx.resume)ctx.resume()}catch(e){}
 T.end=Date.now()+sec*1000;T.label=label;T.done=false;
 var el=document.getElementById('timer');el.style.display='flex';
 el.innerHTML='<span><span id="tl"></span> <strong id="tt"></strong></span><button id="tb" onclick="stopTimer()">Стоп</button>';
 tick()}
function stopTimer(){T.end=0;document.getElementById('timer').style.display='none'}
function beep(){try{if(!ctx)return;for(var i=0;i<3;i++){(function(i){var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=0.2;o.start(ctx.currentTime+i*0.35);o.stop(ctx.currentTime+i*0.35+0.2)})(i)}}catch(e){}}
function buzz(){try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback)Telegram.WebApp.HapticFeedback.notificationOccurred('success')}catch(e){}try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function tick(){
 if(!T.end)return;
 var left=Math.ceil((T.end-Date.now())/1000),tl=document.getElementById('tl'),tt=document.getElementById('tt');
 if(!tl||!tt)return;
 if(left<=0){
  if(!T.done){T.done=true;beep();buzz();var b=document.getElementById('tb');if(b)b.textContent='ОК'}
  tl.textContent='Время вышло!';tt.textContent='';return}
 tl.textContent=T.label;tt.textContent=fmtT(left)}
setInterval(tick,250);
function timerBtns(k){return TIMERS[k].map(function(x){return '<button class="btn ghost small" onclick="startTimer('+x[0]+',\''+x[1]+'\')">'+(x[0]>=60?(x[0]/60)+' мин':x[0]+' сек')+'</button>'}).join(' ')}

function customTimer(){
 var m=parseInt(document.getElementById('tm').value)||0,s=parseInt(document.getElementById('ts').value)||0,t=m*60+s;

  var e=EX[view.a],mine=log.filter(function(x){return x.ex===view.a}),last=mine[mine.length-1];
  h+=back('Назад','day',view.b)+'<h1>'+e.n+'<span class="tag">'+e.m+'</span></h1>';
  if(e.a){var cp=e.cap||['Начало','Конец'];h+='<div class="card"><div class="pair"'+(e.b?'':' style="max-width:300px;margin:0 auto"')+'><figure>'+e.a+'<figcaption>'+cp[0]+'</figcaption></figure>'+(e.b?'<figure>'+e.b+'<figcaption>'+cp[1]+'</figcaption></figure>':'')+'</div><p class="muted">Рисунки схематичные.</p></div>'}
  else{h+='<div class="soon card">Схема скоро появится</div>'}
  h+='<div class="card"><h2>Техника</h2><ul>'+e.t.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>';
  h+=timerCard(e.k);
  var inp=e.k==='s'?'<div class="grid"><input id="i1" type="number" inputmode="decimal" placeholder="Вес, кг"><input id="i2" type="number" inputmode="numeric" placeholder="Повторы"></div>'
        :'<div style="margin:8px 0"><input id="i1" type="number" inputmode="numeric" placeholder="'+(e.k==='c'?'Минуты':e.k==='r'?'Повторы':'Секунды')+'"></div>';
  h+='<div class="card"><h2>Записать</h2>'+(last?'<p class="muted">В прошлый раз: '+fmtLog(last)+' ('+esc(last.d)+')</p>':'')+inp+'<button class="btn" onclick="addLog()">Сохранить</button></div>';
 }
 else if(view.s==='diary'){
  h+=back('Назад','home')+'<h1>Дневник</h1>';
  if(!log.length)h+='<p class="muted">Пока пусто. Записи появятся после первого сохранения.</p>';
  log.slice().reverse().forEach(function(x){h+='<div class="card"><div class="row"><strong>'+esc(EX[x.ex]?EX[x.ex].n:x.ex)+'</strong><span class="muted">'+esc(x.d)+'</span></div><span>'+fmtLog(x)+'</span></div>'});
  if(log.length)h+='<button class="btn ghost" onclick="clearLog()">Очистить дневник</button>';
 }
 else if(view.s==='edit'){
  h+=back('Готово','home')+'<h1>Изменить план</h1>';
  h+='<input value="'+esc(p.n)+'" onchange="renameP(this.value)" placeholder="Название плана">';
  p.days.forEach(function(d,i){
   h+='<div class="card"><input value="'+esc(d.n)+'" onchange="renameD('+i+',this.value)" placeholder="Название дня">';
   d.ex.forEach(function(id,j){h+='<div class="item"><div class="thumb" style="margin-right:10px">'+EX[id].a+'</div><span style="flex:1">'+EX[id].n+'</span><button class="x" onclick="rmEx('+i+','+j+')">✕</button></div>'});
   h+='<div class="opts"><button class="btn small" onclick="go(\'pick\','+i+')">+ Упражнение</button>'+(p.days.length>1?'<button class="btn ghost small" onclick="rmDay('+i+')">Удалить день</button>':'')+'</div></div>'});
  h+='<button class="btn" onclick="addDay()">+ Добавить день</button>';
 }
 else if(view.s==='pick'){
  var day=p.days[view.a];
  h+=back('Готово','edit')+'<h1>Добавить в «'+esc(day.n)+'»</h1>';
  CATS.forEach(function(c){
   var ids=Object.keys(EX).filter(function(id){return EX[id].m===c});if(!ids.length)return;
   h+='<h3>'+c+'</h3>';
   ids.forEach(function(id){var has=day.ex.indexOf(id)>=0;
    h+='<div class="card click" onclick="addEx('+view.a+',\''+id+'\')"><div class="row"><div class="thumb">'+EX[id].a+'</div><span style="flex:1">'+EX[id].n+'</span><span>'+(has?'✓':'+')+'</span></div></div>'})});
 }
 document.getElementById('app').innerHTML=h;
}

function addLog(){
 var e=EX[view.a],a=document.getElementById('i1').value,b=e.k==='s'?document.getElementById('i2').value:'';
 if(!a||(e.k==='s'&&!b)){toast(e.k==='s'?'Введи вес и повторы':'Введи число');return}
 log.push({ex:view.a,a:a,b:b,d:new Date().toLocaleDateString('ru-RU')});save('log',log);render();
}
function clearLog(){askConfirm('Удалить все записи?',function(){log=[];save('log',log);render()})}
render();
</script></body></html>
